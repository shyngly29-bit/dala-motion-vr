<!doctype html>
<html lang="kk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DALA MOTION VR — VR-хаб және ойындар</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cy:#8fe9ff;--or:#e0a050;--gold:#f0c674;--ink:#eafaff;--glass:rgba(8,26,34,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04121a;color:var(--ink);font-family:Inter,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(160,240,255,.25);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 40px rgba(0,0,0,.35)}
#top{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 8px;z-index:30;border-radius:40px}
#top .logo{font:700 18px Lora;letter-spacing:.06em;padding:0 14px;color:var(--gold);white-space:nowrap}
.tb{all:unset;cursor:pointer;font:600 13px Inter;color:#fff;padding:9px 14px;border-radius:30px;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.12)}
.tb[disabled]{opacity:.45;cursor:default}
#xr{display:none}
/* хаб */
.hcard{position:fixed;width:250px;padding:14px 16px;transform:translate(-50%,8px);z-index:10;opacity:0;transition:opacity .4s}
.hcard h3{font:700 21px Lora;margin-bottom:4px}
.hcard .law{font:500 13px/1.4 Inter;color:#cdeef5;margin-bottom:10px}
.hcard .fx{font:italic 500 16px Lora;color:#fff;margin-bottom:10px}
.btn{all:unset;cursor:pointer;display:inline-block;font:600 13px Inter;padding:9px 14px;border-radius:24px;background:linear-gradient(90deg,#2fb4d6,#4fd8ef);color:#03222b;margin:2px 4px 2px 0}
.btn.alt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn:hover{filter:brightness(1.12)}
#hubTitle{position:fixed;left:50%;top:84px;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none}
#hubTitle h1{font:700 clamp(26px,3.4vw,46px) Lora;color:#fff;text-shadow:0 0 30px rgba(143,233,255,.6)}
#hubTitle p{font:500 14px Inter;color:#bfe6ee;margin-top:6px}
/* игра */
#panel{position:fixed;left:16px;top:84px;width:300px;max-height:calc(100vh - 100px);overflow:auto;padding:16px;z-index:20;display:none}
#panel h2{font:700 22px Lora;margin-bottom:2px}
#panel .sub{font:500 12px Inter;color:#9fd;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.ctl{margin:10px 0}
.ctl label{display:flex;justify-content:space-between;font:600 12.5px Inter;color:#d8f2f7;margin-bottom:4px}
.ctl label b{color:#fff;font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:#4fd8ef}
.ctl select{width:100%;padding:7px;border-radius:10px;background:#0b2a33;color:#fff;border:1px solid rgba(255,255,255,.2);font:500 13px Inter}
.row2{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
#readout{position:fixed;right:16px;top:84px;width:300px;padding:16px;z-index:20;display:none}
#readout .fx{font:italic 500 18px Lora;color:#fff;margin:2px 0 6px}
.kv{display:flex;justify-content:space-between;font:500 13px Inter;color:#cdeef5;margin:4px 0}
.kv b{color:#fff;font-variant-numeric:tabular-nums}
#graph{width:100%;height:140px;margin-top:10px;display:block}
#result{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 20px;z-index:20;font:600 15px Inter;display:none;text-align:center;max-width:90vw}
#modal{position:fixed;inset:0;display:none;place-items:center;z-index:50;background:rgba(0,0,0,.45)}
#modal .glass{width:min(640px,92vw);max-height:84vh;overflow:auto;padding:24px 26px}
#modal h2{font:700 26px Lora;margin-bottom:12px}
#modal p,#modal li{font:400 15px/1.6 Inter;color:#dff3f7;margin-bottom:8px}
#modal .fx{font:italic 500 19px Lora;color:#fff;margin:8px 0}
#fade{position:fixed;inset:0;background:radial-gradient(circle,#fff,#bff4ff 40%,#3aa8c8);opacity:0;pointer-events:none;z-index:40}
#msg{position:fixed;inset:0;display:none;place-items:center;z-index:60;background:#04121a;padding:24px;text-align:center;font:500 16px/1.6 Inter}
#load{position:fixed;inset:0;display:grid;place-items:center;z-index:45;background:#04121a;font:500 15px Inter;transition:opacity .6s}
.note{font:500 11px/1.4 Inter;color:#ffd8a8;margin-top:10px}
@media (max-width:820px){
 #top .logo{display:none}
 #panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:42vh}
 #readout{right:8px;left:8px;width:auto;top:64px;padding:10px 12px}
 #readout #graph{height:70px}
 .hcard{width:200px;padding:10px 12px}.hcard h3{font-size:17px}.hcard .law{display:none}
 #hubTitle{top:64px}#hubTitle p{display:none}
}
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const $=id=>document.getElementById(id);
function fail(t){$('msg').style.display='grid';$('msg').innerHTML=t;$('load').remove()}
try{const c=document.createElement('canvas');if(!(c.getContext('webgl2')||c.getContext('webgl')))throw 0}catch(e){fail('Бұл құрылғы WebGL-ді қолдамайды.<br>3D ойындар үшін Chrome, Edge немесе Firefox-тың жаңа нұсқасын ашыңыз.<br><a style="color:#8fe9ff" href="index.html">Слайдтарға оралу</a>');throw e}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE=matchMedia('(max-width: 820px), (pointer: coarse)').matches;

/* ================= утилиты ================= */
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
 return lerp(lerp(hash(ix,iy),hash(ix+1,iy),ux),lerp(hash(ix,iy+1),hash(ix+1,iy+1),ux),uy)}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5}return s}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
function koshkar(c,s){c.beginPath();for(const k of[-1,1]){c.moveTo(0,s*.55);c.bezierCurveTo(0,s*.05,k*s*.12,-s*.38,k*s*.45,-s*.42);
 c.bezierCurveTo(k*s*.78,-s*.44,k*s*.8,-s*.05,k*s*.55,-s*.02);c.bezierCurveTo(k*s*.38,0,k*s*.36,-s*.22,k*s*.5,-s*.22)}c.stroke()}
const fmt=(v,d=2)=>Number(v).toFixed(d).replace('.',',');

/* ================= рендер ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:!MOBILE,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.5:2));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=!MOBILE;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.xr.enabled=true;
const ENV=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;   // отражения для PBR
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.03,4000);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enabled=false;
const uTime={value:0};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

/* ================= общая среда: небо, степь, свет ================= */
function makeSky(scene,top,hor,sunDir,sunCol){const U={top:{value:new THREE.Color(top)},hor:{value:new THREE.Color(hor)},sunDir:{value:sunDir.clone().normalize()},sunCol:{value:new THREE.Color(sunCol)}};
 const m=new THREE.Mesh(new THREE.SphereGeometry(2500,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:U,
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform vec3 top,hor,sunDir,sunCol;varying vec3 vD;void main(){float h=max(vD.y,0.);vec3 c=mix(hor,top,pow(h,.55));
  float s=max(dot(vD,sunDir),0.);c+=sunCol*(pow(s,600.)*3.+pow(s,10.)*.4);c=mix(c,hor*.6,smoothstep(0.,-.2,vD.y));gl_FragColor=vec4(c,1.);}`}));scene.add(m);return U}
function groundH(x,z){const r=Math.hypot(x,z);let h=(fbm(x*.03+7,z*.03)*2.2-1)*ss(18,70,r);h+=ss(220,600,r)*Math.pow(fbm(x*.004,z*.004+3,5),1.6)*230;return h}
function makeSteppe(scene,{grass=MOBILE?6000:20000,area=[-30,40,-30,30],clear=0,sun=new THREE.Vector3(.5,.12,-.85)}={}){
 makeSky(scene,0x24365e,0xf09a5a,sun,0xffc27a);scene.fog=new THREE.Fog(0xe9a774,90,1300);
 const L=new THREE.DirectionalLight(0xffd2a0,2.6);L.position.copy(sun).multiplyScalar(60);L.castShadow=!MOBILE;L.shadow.mapSize.set(2048,2048);
 Object.assign(L.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:1,far:200});L.shadow.normalBias=.02;scene.add(L,L.target);
 scene.add(new THREE.HemisphereLight(0x9ab2e0,0x6b4a2a,1.15));
 const g=new THREE.PlaneGeometry(3200,3200,MOBILE?140:220,MOBILE?140:220);g.rotateX(-Math.PI/2);const p=g.attributes.position,col=[],c=new THREE.Color();
 const a=new THREE.Color(0xb8904a),b=new THREE.Color(0x6e6a34),m=new THREE.Color(0x5b4a5e),snow=new THREE.Color(0xf4ece4);
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=groundH(x,z);p.setY(i,h);c.copy(a).lerp(b,fbm(x*.05,z*.05)*.9);c.lerp(m,ss(20,160,h)*.7);c.lerp(snow,ss(150,200,h+fbm(x*.02,z*.02)*30));col.push(c.r,c.g,c.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();const gr=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));gr.receiveShadow=true;scene.add(gr);
 // трава (InstancedMesh, ветер в шейдере)
 const bg=new THREE.PlaneGeometry(.045,.55,1,4);bg.translate(0,.275,0);const bp=bg.attributes.position;for(let i=0;i<bp.count;i++)bp.setX(i,bp.getX(i)*(1-bp.getY(i)/.57));
 const gm=new THREE.MeshLambertMaterial({side:THREE.DoubleSide});gm.onBeforeCompile=sh=>{sh.uniforms.uTime=uTime;sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',
  `#include <begin_vertex>
  float hh=position.y/.55;vec2 ip=vec2(instanceMatrix[3].x,instanceMatrix[3].z);float w=sin(uTime*1.5+ip.x*.3+ip.y*.2)*.12+sin(uTime*3.1+ip.x*1.7)*.03;transformed.x+=w*hh*hh;transformed.z+=w*.4*hh*hh;`)};
 const im=new THREE.InstancedMesh(bg,gm,grass),d=new THREE.Object3D(),R=rng(9);
 for(let i=0;i<grass;i++){let x,z,n=0;do{x=lerp(area[0],area[1],R());z=lerp(area[2],area[3],R())}while(Math.hypot(x,z)<clear&&++n<20);d.position.set(x,groundH(x,z),z);d.rotation.set((R()-.5)*.3,R()*6.3,(R()-.5)*.3);d.scale.set(1,.5+R()*1.0,1);d.updateMatrix();im.setMatrixAt(i,d.matrix);
  c.setHSL(.1+R()*.06,.45+R()*.2,.4+R()*.18);im.setColorAt(i,c)}scene.add(im);
 // юрты
 const band=tex(512,64,(cx,w,h)=>{cx.fillStyle='#efe3cc';cx.fillRect(0,0,w,h);cx.fillStyle='#9c2a1e';cx.fillRect(0,0,w,10);cx.fillRect(0,h-10,w,10);cx.strokeStyle='#9c2a1e';cx.lineWidth=4;for(let x=32;x<w;x+=64){cx.save();cx.translate(x,h/2+4);koshkar(cx,40);cx.restore()}});
 band.wrapS=THREE.RepeatWrapping;band.repeat.set(4,1);const wall=new THREE.MeshLambertMaterial({map:band}),roof=new THREE.MeshLambertMaterial({color:0xe8dcc4}),door=new THREE.MeshLambertMaterial({color:0xb5562a});
 [[-40,-55],[-28,-62],[-52,-66],[-14,-70],[60,-60]].forEach(([x,z],i)=>{const y=new THREE.Group(),r=3+i%2*.6;const wl=new THREE.Mesh(new THREE.CylinderGeometry(r,r,2.2,32,1,true),wall);wl.position.y=1.1;
  const rf=new THREE.Mesh(new THREE.SphereGeometry(r*1.02,32,12,0,Math.PI*2,0,Math.PI/2.6),roof);rf.position.y=1.5;rf.scale.y=.75;const dr=new THREE.Mesh(new THREE.PlaneGeometry(1,1.7),door);dr.position.set(0,.85,r+.02);
  y.add(wl,rf,dr);y.position.set(x,groundH(x,z),z);y.rotation.y=.6+i*.3;y.traverse(o=>o.castShadow=true);scene.add(y)});
 // тканевые флаги
 const fm=new THREE.MeshLambertMaterial({side:THREE.DoubleSide,map:tex(256,384,(cx,w,h)=>{cx.fillStyle='#8f1d18';cx.fillRect(0,0,w,h);cx.strokeStyle='#e3b25a';cx.lineWidth=6;cx.strokeRect(14,14,w-28,h-28);cx.lineWidth=8;cx.save();cx.translate(w/2,h/2);koshkar(cx,150);cx.restore()})});
 fm.onBeforeCompile=sh=>{sh.uniforms.uTime=uTime;sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nfloat u=position.x+.45;transformed.z+=sin(uTime*3.2-u*5.)*.09*u;transformed.y-=u*u*.05;')};
 [[-6,-8],[8,-10]].forEach(([x,z])=>{const pole=new THREE.Mesh(new THREE.CylinderGeometry(.03,.035,3.6,8),new THREE.MeshLambertMaterial({color:0x4a3220}));pole.position.set(x,groundH(x,z)+1.8,z);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.3,16,8),fm);fl.position.set(x+.45,groundH(x,z)+2.85,z);scene.add(pole,fl)});
 return {sun:L}}

/* ================= временная rigged-модель человека (Soldier.glb) + IK ================= */
let soldierGLTF=null;
const loadSoldier=()=>soldierGLTF?Promise.resolve(soldierGLTF):new GLTFLoader().loadAsync('assets/Soldier.glb').then(g=>soldierGLTF=g);
const _q=new THREE.Quaternion(),_q2=new THREE.Quaternion(),_qp=new THREE.Quaternion(),_v=[...Array(10)].map(()=>new THREE.Vector3());
function rotWorld(bone,q){bone.getWorldQuaternion(_q);_q.premultiply(q);bone.parent.getWorldQuaternion(_qp);bone.quaternion.copy(_qp.invert().multiply(_q));bone.updateWorldMatrix(false,true)}
function ik2(up,lo,end,target,pole){const [A,B,C,D,U,T,X,P,N]=_v;
 up.getWorldPosition(A);lo.getWorldPosition(B);end.getWorldPosition(C);const a=A.distanceTo(B),b=B.distanceTo(C);D.subVectors(target,A);
 const d=Math.min(Math.max(D.length(),Math.abs(a-b)+1e-3),(a+b)*.96);D.normalize();U.subVectors(pole,A);U.addScaledVector(D,-U.dot(D)).normalize();
 const ca=(a*a+d*d-b*b)/(2*a*d),sa=Math.sqrt(Math.max(0,1-ca*ca));T.copy(D).multiplyScalar(ca).addScaledVector(U,sa);X.subVectors(B,A).normalize();
 _q2.setFromUnitVectors(X,U);_q.setFromUnitVectors(U,T).multiply(_q2);rotWorld(up,_q.clone());
 N.crossVectors(D,U).normalize();lo.getWorldPosition(B);end.getWorldPosition(C);X.subVectors(C,B).normalize();P.subVectors(target,B).normalize();
 rotWorld(lo,new THREE.Quaternion().setFromAxisAngle(N,Math.atan2(X.clone().cross(P).dot(N),X.dot(P))))}
// персонаж: стоит лицом к +Z, рост ≈1.75 м; facing — поворот вокруг Y
function makePerson(g,facing=0){const root=SkeletonUtils.clone(g.scene),bones={};root.traverse(o=>{if(o.isBone)bones[o.name]=o;if(o.isMesh){o.castShadow=true;o.frustumCulled=false;if(/visor/i.test(o.name))o.visible=false}});
 const mixer=new THREE.AnimationMixer(root);const idle=mixer.clipAction(THREE.AnimationClip.findByName(g.animations,'Idle'));idle.play();mixer.setTime(.4);
 root.updateMatrixWorld(true);const h=new THREE.Vector3(),t=new THREE.Vector3(),f=new THREE.Vector3();bones.mixamorigHead.getWorldPosition(h);bones.mixamorigLeftToeBase.getWorldPosition(t);root.scale.multiplyScalar(1.5/(h.y-t.y));
 root.updateMatrixWorld(true);for(const sd of['Left','Right']){bones[`mixamorig${sd}ToeBase`].getWorldPosition(h);bones[`mixamorig${sd}Foot`].getWorldPosition(t);f.add(h.sub(t))}
 root.rotation.y-=Math.atan2(f.x,f.z);root.updateMatrixWorld(true);bones.mixamorigLeftToeBase.getWorldPosition(t);root.position.y-=t.y-.04;
 const base=new Map();Object.values(bones).forEach(b=>base.set(b,b.quaternion.clone()));
 const tp=THREE.AnimationClip.findByName(g.animations,'TPose');if(tp){idle.stop();mixer.clipAction(tp).play();mixer.setTime(0);Object.values(bones).forEach(b=>{if(/(Shoulder|Arm|ForeArm|Hand)/.test(b.name))base.set(b,b.quaternion.clone())})}
 const pivot=new THREE.Group(),holder=new THREE.Group();holder.add(root);holder.rotation.y=facing;pivot.add(holder);
 const P={pivot,root,bones,reset(){base.forEach((q,b)=>b.quaternion.copy(q));pivot.updateMatrixWorld(true)},
  yaw(name,a){rotWorld(bones[name],new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),a))},
  arm(side,target,pole){ik2(bones[`mixamorig${side}Arm`],bones[`mixamorig${side}ForeArm`],bones[`mixamorig${side}Hand`],target,pole)},
  curl(side,amt){['Index','Middle','Ring','Pinky'].forEach(fg=>[1,2,3].forEach(i=>{const b=bones[`mixamorig${side}Hand${fg}${i}`];if(b)b.rotation.z+=(side==='Left'?amt:-amt)}))}};
 return P}

/* ================= общий интерфейс игры ================= */
const UI={panel:$('panel'),read:$('readout'),res:$('result')};
function slider(id,label,min,max,step,val,unit,fmtd=2){return `<div class="ctl"><label>${label}<b id="${id}v">${fmt(val,fmtd)} ${unit}</b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-u="${unit}" data-d="${fmtd}"></div>`}
function bindSliders(onChange){UI.panel.querySelectorAll('input[type=range]').forEach(r=>{const f=()=>{$(r.id+'v').textContent=fmt(+r.value,+r.dataset.d)+' '+r.dataset.u;onChange&&onChange()};r.oninput=f})}
const val=id=>+$(id).value;
function result(html){UI.res.innerHTML=html;UI.res.style.display=html?'block':'none'}
function graph(draw){const c=$('graph');if(!c)return;const g=c.getContext('2d'),W=c.width=c.clientWidth*devicePixelRatio,H=c.height=c.clientHeight*devicePixelRatio;g.clearRect(0,0,W,H);
 g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=devicePixelRatio;g.beginPath();g.moveTo(30*devicePixelRatio,6);g.lineTo(30*devicePixelRatio,H-20*devicePixelRatio);g.lineTo(W-6,H-20*devicePixelRatio);g.stroke();

 build(){const S=this.scene=new THREE.Scene();S.environment=ENV;S.environmentIntensity=.35;
  makeSky(S,0x3d6fb0,0xcfe3f2,new THREE.Vector3(.4,.6,-.6),0xffffff);S.fog=new THREE.Fog(0xcfe3f2,250,1800);
  const L=new THREE.DirectionalLight(0xfff2dc,2.4);L.position.set(80,140,60);L.castShadow=!MOBILE;Object.assign(L.shadow.camera,{left:-60,right:60,top:120,bottom:-10,far:400});L.shadow.mapSize.set(2048,2048);S.add(L);S.add(new THREE.HemisphereLight(0xbcd6ff,0x8a8070,1.2));
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshStandardMaterial({color:0xa9a294,roughness:.95}));gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;S.add(gnd);
  const plaza=new THREE.Mesh(new THREE.CircleGeometry(45,64),new THREE.MeshStandardMaterial({color:0xdcd6cc,roughness:.7}));plaza.rotation.x=-Math.PI/2;plaza.position.y=.02;plaza.receiveShadow=true;S.add(plaza);
  S.add(buildBaiterek(1));
  // город на фоне
  const R=rng(77),win=tex(64,128,(c,w,h)=>{c.fillStyle='#2b3a4a';c.fillRect(0,0,w,h);for(let y=4;y<h;y+=8)for(let x=4;x<w;x+=8){c.fillStyle=Math.random()<.3?'#9fc4e0':'#4a6278';c.fillRect(x,y,5,5)}});win.wrapS=win.wrapT=THREE.RepeatWrapping;
  for(let i=0;i<60;i++){const a=R()*6.28,r=160+R()*350,h=30+R()*130,w=12+R()*20;const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshStandardMaterial({map:win.clone(),roughness:.4,metalness:.3}));m.material.map.repeat.set(w/10,h/12);m.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);S.add(m)}
  // площадка для опыта рядом с шаром и шкала высоты
  this.plat=new THREE.Mesh(new THREE.BoxGeometry(3,.3,6),new THREE.MeshStandardMaterial({color:0x2f6f86,metalness:.5,roughness:.3}));S.add(this.plat);
  const sc=new THREE.Group();for(let h=0;h<=100;h+=10){const t=new THREE.Mesh(new THREE.BoxGeometry(1.2,.12,.12),new THREE.MeshBasicMaterial({color:h%50?0xffffff:0xffd27a}));t.position.set(14,h,-4.5);sc.add(t)}
  const pole=new THREE.Mesh(new THREE.BoxGeometry(.12,100,.12),new THREE.MeshBasicMaterial({color:0xffffff}));pole.position.set(14,50,-4.5);sc.add(pole);S.add(sc);
  this.balls=[0,1].map(i=>{const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35,metalness:.4}));m.castShadow=true;S.add(m);return m})},
 ui(){const opt=Object.entries(OBJS).map(([k,o])=>`<option value="${k}">${o.n}</option>`).join('');
  UI.panel.innerHTML=`<h2>Бәйтерек</h2><div class="sub">Виртуалды еркін түсу тәжірибесі</div>
  <div class="ctl"><label>1-дене</label><select id="o1">${opt}</select></div>${slider('k1','1-дене массасы (×)',.5,4,.1,1,'',1)}
  <div class="ctl"><label>2-дене</label><select id="o2">${opt}</select></div>${slider('k2','2-дене массасы (×)',.5,4,.1,1,'',1)}
  ${slider('h','Биіктік h',5,97,1,97,'м',0)}
  <div class="ctl"><label><span><input type="checkbox" id="air"> Ауа кедергісін қосу</span></label></div>
  <div class="ctl"><label>Уақыт</label><select id="spd"><option value="1">Нақты уақыт</option><option value="5">Жылдамдату ×5</option></select></div>
  ${commonButtons('<button class="btn" id="bAct">Тастау</button>')}<div class="note">Денелер көрінуі үшін 25 есе үлкейтіліп сызылған; есептеу нақты өлшеммен.</div>`;
  $('o2').value='feather';
  UI.read.innerHTML=`<div class="fx">h = gt²/2</div><div class="kv">Теория (ауасыз) t<b id="rTh"></b></div><div class="kv">1-дене t / v<b id="r1">—</b></div><div class="kv">2-дене t / v<b id="r2">—</b></div><canvas id="graph"></canvas>`;
  bindSliders(()=>this.reset());['o1','o2','air','spd'].forEach(i=>$(i).onchange=()=>this.reset());bindCommon(this);$('bAct').onclick=()=>this.drop()},
 reset(){const h=val('h');this.H=h;this.run=false;this.t=0;this.hist=[[],[]];result('');
  this.obj=[OBJS[$('o1').value],OBJS[$('o2').value]].map((o,i)=>({...o,m:o.m*val('k'+(i+1)),y:h,v:0,done:false,tLand:null}));
  this.plat.position.set(16,h-.15,0);this.obj.forEach((o,i)=>{const b=this.balls[i];b.material.color.set(o.col);b.scale.setScalar(Math.max(.25,o.r*25));b.position.set(16,h+b.scale.x,i?1.6:-1.6)});
  $('rTh').textContent=fmt(Math.sqrt(2*h/9.8),2)+' с';$('r1').textContent=$('r2').textContent='—';
  camera.position.set(-30,h+8,62);controls.target.set(10,h-14,0);controls.update();graph(()=>{})},
 drop(){if(this.run)return;this.reset();this.run=true},
 update(dt){if(!this.run)return;const air=$('air').checked,rho=1.225,sub=20,dd=dt*+$('spd').value/sub;
  for(let s=0;s<sub;s++){this.t+=dd;this.obj.forEach((o,i)=>{if(o.done)return;const A=Math.PI*o.r*o.r,drag=air?.5*rho*o.cd*A*o.v*o.v/o.m:0;const a=9.8-drag;o.v+=a*dd;o.y-=o.v*dd;
   if(o.y<=0){o.y=0;o.done=true;o.tLand=this.t}})}
  this.obj.forEach((o,i)=>{this.balls[i].position.y=o.y+this.balls[i].scale.x;this.hist[i].push([this.t,o.v]);$('r'+(i+1)).textContent=fmt(o.tLand??this.t,2)+' с / '+fmt(o.v,1)+' м/с'});
  const yMid=(this.obj[0].y+this.obj[1].y)/2;controls.target.lerp(new THREE.Vector3(14,yMid,0),.08);camera.position.lerp(new THREE.Vector3(-26,yMid+10,60),.05);
  graph((g,W,H,ox,oy)=>{const T=Math.max(2,this.t),V=Math.max(5,...this.obj.map(o=>o.v))*1.1;[['#8fe9ff',0],['#ffb35c',1]].forEach(([c,i])=>{g.strokeStyle=c;g.lineWidth=2*devicePixelRatio;g.beginPath();this.hist[i].forEach(([t,v],k)=>g[k?'lineTo':'moveTo'](ox+t/T*(W-ox-8),oy-v/V*(oy-8)));g.stroke()});
   g.fillStyle='#cdeef5';g.font=`${11*devicePixelRatio}px Inter`;g.fillText('v(t), м/с',ox+6,14*devicePixelRatio)});
  if(this.obj.every(o=>o.done)){this.run=false;const [a,b]=this.obj;const dtl=Math.abs(a.tLand-b.tLand);
   result(dtl<.01?`Екі дене бір мезгілде түсті: t = ${fmt(a.tLand,2)} с. Ауасыз жағдайда масса әсер етпейді.`:`${a.n}: ${fmt(a.tLand,2)} с, ${b.n}: ${fmt(b.tLand,2)} с. Айырма ${fmt(dtl,2)} с — ауа кедергісінің әсері.`)}}};

/* ================= переходы между хабом и играми ================= */
let mode='hub',cur=null;
function setUI(game){const g=!!game;UI.panel.style.display=UI.read.style.display=g?'block':'none';$('hubTitle').style.display=g?'none':'block';$('cards').style.display=g?'none':'block';if(!g)result('')}
function flash(cb){gsap.to('#fade',{opacity:1,duration:REDUCED?.01:.45,ease:'power2.in',onComplete:()=>{cb();gsap.to('#fade',{opacity:0,duration:REDUCED?.01:.6,delay:.05,ease:'power2.out'})}})}
function openGame(id){const G=GAMES[id];HUB.leaving=true;const i=HUBLIST.findIndex(x=>x.id===id),a=HUB.anchors[i];
 const go=()=>flash(()=>{if(!G.scene)G.build();cur=G;mode='game';timeScale=1;paused=false;controls.enabled=true;setUI(G);G.ui();G.reset();HUB.leaving=false;location.hash=id});
 if(REDUCED)return go();gsap.to(camera.position,{x:a.x*.55,y:2.2,z:a.z*.55,duration:.9,ease:'power2.inOut',onUpdate:()=>camera.lookAt(a.x,1,a.z),onComplete:go})}
function goHub(){flash(()=>{mode='hub';cur=null;controls.enabled=false;setUI(null);location.hash=''})}
$('toHub').onclick=()=>mode!=='hub'&&goHub();
$('fsb').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});

/* ================= WebXR (бета) ================= */
if(navigator.xr&&navigator.xr.isSessionSupported){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(!ok)return;const b=$('xr');b.style.display='inline-block';
 b.onclick=async()=>{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});renderer.xr.setSession(s)};
 // контроллеры: курок = главное действие текущей игры (Ату / Тастау / Бастау)
 [0,1].forEach(i=>{const c=renderer.xr.getController(i);c.addEventListener('select',()=>{if(!cur)return openGame('bow');($('bAct')||{}).click&&$('bAct').click()});(cur?cur.scene:HUB.scene).add(c)})}).catch(()=>{})}

/* ================= цикл ================= */
buildHub();camera.position.set(0,5.2,13);camera.lookAt(0,1.6,0);
const clock=new THREE.Clock();
function tick(dt){uTime.value+=dt;
 if(mode==='hub'){hubUpdate(dt);renderer.render(HUB.scene,camera)}
 else{if(!paused)cur.update(dt*timeScale);controls.update();renderer.render(cur.scene,camera)}}
renderer.setAnimationLoop(()=>tick(Math.min(.05,clock.getDelta())));
setTimeout(()=>{$('load').style.opacity=0;setTimeout(()=>$('load').remove(),700)},200);
const start=location.hash.slice(1);if(GAMES[start])setTimeout(()=>openGame(start),400);
addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);[HUB.scene,...Object.values(GAMES).map(g=>g.scene)].forEach(s=>s&&s.traverse(o=>{o.geometry&&o.geometry.dispose();[].concat(o.material||[]).forEach(m=>m.dispose&&m.dispose())}));renderer.dispose()});
window.__G={GAMES,HUB,openGame,goHub,tick:(n=1,dt=1/60)=>{for(let i=0;i<n;i++){gsap.ticker.tick();tick(dt)}}};
</script>
</body></html>
